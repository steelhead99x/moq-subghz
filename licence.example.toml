# Template for the private licence file used by licensed mode. See docs/LICENSING.md.
#
# Copy it OUTSIDE the repo, fill in your own values and chmod 600 it:
#   mkdir -p ~/.config/moq-subghz && cp licence.example.toml ~/.config/moq-subghz/licence.toml
# The tools find it through --licence-file PATH, the MOQ_SUBGHZ_LICENCE env var, or
# $XDG_CONFIG_HOME/moq-subghz/licence.toml. Never commit the filled-in file.
#
# The values below are obvious fakes. The loader rejects them, so licensed mode cannot start
# from this file. The tools check the SHAPE of the ID only and cannot verify it.

region = "us"                              # "us", or "other" (needs id_mask and id_interval_secs)
licence_id = "REPLACE-WITH-YOUR-ID"
operator_name = "REPLACE WITH YOUR NAME"

# Only for region = "other": there are no built-in rules, so give your own.
# id_mask = "LLDLL"            # L = letter, D = digit, anything else literal
# id_interval_secs = 600       # longest gap between identifications your rules allow
