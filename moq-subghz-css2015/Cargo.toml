[package]
name = "moq-subghz-css2015"
version = "0.1.0"
description = "A 2015-style CSS mode image test: chunked JPEG, SSDV and framed uplinks from the board HAT, logged on an RP2040-based device"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
sx1276 = { path = "../vendor/sx1276" }
moq-subghz-licence = { path = "../moq-subghz-licence", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
aes = "0.9.4"
moq-subghz-wire = { path = "../moq-subghz-wire", default-features = false }
cmac = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
moq-subghz-link = { path = "../moq-subghz-link" }
moq-subghz-radio-sx1276 = { path = "../radios/moq-subghz-radio-sx1276" }

[dev-dependencies]
moq-subghz-licence = { path = "../moq-subghz-licence", features = ["cli", "testing"] }
