[package]
name = "moq-subghz-lora2015"
version = "0.1.0"
description = "A 2015-style LoRa image test: chunked JPEG, SSDV and LoRaWAN-framed uplinks from the Pi HAT, logged on a CatWAN stick"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
sx1276 = { path = "../vendor/sx1276" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
aes = "0.9.4"
cmac = "0.8.0"

[target.'cfg(target_os = "linux")'.dependencies]
moq-subghz-link = { path = "../moq-subghz-link" }
moq-subghz-radio-sx1276 = { path = "../radios/moq-subghz-radio-sx1276" }
