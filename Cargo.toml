[workspace]
resolver = "2"
members = [
    "moq-subghz-licence",
    "radios/moq-subghz-radio-emu",
    "moq-subghz-report", "moq-subghz-wire", "moq-subghz-pi", "moq-subghz-send", "moq-subghz-recv", "moq-subghz-lora2015", "moq-subghz-link", "radios/moq-subghz-radio-sx1276"]
# moq-subghz-publish needs Rust 1.91 for the moq.dev crates; it builds on its own.
exclude = ["vendor/sx1276", "firmware/catwan-fw", "moq-subghz-publish"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/steelhead99x/moq-subghz"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
