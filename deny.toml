# cargo-deny policy: licences, banned crates and allowed sources. The advisory database is not
# checked here (it needs a network fetch); the CI job runs `licenses bans sources` only.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "armv7-unknown-linux-gnueabihf",
    "armv7-unknown-linux-musleabihf",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rind has no crates.io release: one git dependency, pinned by rev (docs/DEPENDENCIES.md).
allow-git = ["https://github.com/kixel-ai/rind"]
