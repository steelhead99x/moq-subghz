[package]
name = "moq-subghz-recv"
version = "0.1.0"
description = "Mac side: CatWAN RP2040 (SX1276) USB serial -> objects -> live H.264 to ffplay + recording + latency"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
moq-subghz-wire = { path = "../moq-subghz-wire" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
moq-subghz-link = { path = "../moq-subghz-link" }
moq-subghz-radio-sx1276 = { path = "../radios/moq-subghz-radio-sx1276" }
sx1276 = { path = "../vendor/sx1276" }
