[package]
name = "moq-subghz-recv"
version = "0.1.0"
description = "Mac side: RP2040-based device (SX1276) USB serial -> objects -> live H.264 to ffplay + recording + latency"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
moq-subghz-wire = { path = "../moq-subghz-wire" }
moq-subghz-licence = { path = "../moq-subghz-licence", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
moq-subghz-link = { path = "../moq-subghz-link" }
moq-subghz-radio-sx1276 = { path = "../radios/moq-subghz-radio-sx1276" }
moq-subghz-radio-emu = { path = "../radios/moq-subghz-radio-emu" }
sx1276 = { path = "../vendor/sx1276" }

[dev-dependencies]
moq-subghz-licence = { path = "../moq-subghz-licence", features = ["cli", "testing"] }
