name: ci

on:
  # Pull requests get one run; pushes are only built on main (a PR branch used to run twice).
  push:
    branches: [main]
  # Drafts are skipped: a quest claim is a draft holding an empty commit, and checks
  # run locally until the PR is ready, so marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  host:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: no committed Python bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "committed Python bytecode; remove it (.gitignore covers it)" >&2
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: build
        run: cargo build --release
      - name: wire without sealing (no rind, no libc)
        run: cargo test -p moq-subghz-wire --no-default-features

  sx1276:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: driver fmt, clippy, test
        working-directory: vendor/sx1276
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  moq-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # moq.dev's crates need a newer Rust than the radio workspace's 1.90.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt, clippy, test (publishes through an in-process MoQ relay)
        working-directory: moq-subghz-publish
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked

  armv7:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: armv7-unknown-linux-musleabihf,armv7-unknown-linux-gnueabihf
      - name: musl (Pi binaries, rust-lld)
        run: cargo build --release -p moq-subghz-send -p moq-subghz-recv -p moq-subghz-lora2015 -p moq-subghz-bench --target armv7-unknown-linux-musleabihf
      - name: install armhf cross gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: gnueabihf
        run: cargo build --release -p moq-subghz-send -p moq-subghz-recv -p moq-subghz-lora2015 --target armv7-unknown-linux-gnueabihf

  firmware:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - name: shipped UF2 matches SHA256SUMS
        working-directory: firmware
        run: sha256sum -c SHA256SUMS
      - name: fmt, clippy, build
        working-directory: firmware/catwan-fw
        run: |
          cargo fmt --all --check
          cargo clippy --release --target thumbv6m-none-eabi -- -D warnings
          cargo build --release --target thumbv6m-none-eabi
