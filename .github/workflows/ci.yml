name: ci

on:
  # Pull requests get one run; pushes are only built on main (a PR branch used to run twice).
  push:
    branches: [main]
  # Drafts are skipped: a quest claim is a draft holding an empty commit, and checks
  # run locally until the PR is ready, so marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: nothing here writes to the repository or needs a secret.
permissions:
  contents: read

jobs:
  host:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: no committed Python bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo "committed Python bytecode; remove it (.gitignore covers it)" >&2
            exit 1
          fi
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --all-targets --locked
      - name: doc tests (--all-targets skips them)
        run: cargo test --doc --locked
      - name: build
        run: cargo build --release --locked
      - name: wire without sealing (no rind, no libc)
        run: cargo test -p moq-subghz-wire --no-default-features --locked

  # Newer stable than the pin, to see new lints early. Not a merge gate (continue-on-error).
  clippy-stable:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Licences, banned crates and sources (deny.toml). The advisory database is not fetched, so
  # nothing here depends on a moving remote list. Not a merge gate (continue-on-error).
  deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check licenses bans sources

  sx1276:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: driver fmt, clippy, test
        working-directory: vendor/sx1276
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo test --doc --locked

  moq-publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # moq.dev's crates need a newer Rust than the radio workspace's 1.90; the pin matches
      # moq-subghz-publish/rust-toolchain.toml, so a new stable lint cannot break the gate unannounced.
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: fmt, clippy, test (publishes through an in-process MoQ relay)
        working-directory: moq-subghz-publish
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          cargo test --doc --locked

  armv7:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.90.0
          targets: armv7-unknown-linux-musleabihf,armv7-unknown-linux-gnueabihf
      - name: musl (board binaries, rust-lld)
        run: cargo build --release -p moq-subghz-send -p moq-subghz-recv -p moq-subghz-css2015 -p moq-subghz-bench --target armv7-unknown-linux-musleabihf --locked
      - name: install armhf cross gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: gnueabihf
        run: cargo build --release -p moq-subghz-send -p moq-subghz-recv -p moq-subghz-css2015 --target armv7-unknown-linux-gnueabihf --locked

  release:
    # The release archives exactly as scripts/release.sh builds them: both targets, moq-subghz-publish
    # included, static checks, and the smoke test of the unpacked x86-64 archive.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # both pinned toolchains: the workspace's (rust-toolchain.toml) and moq-subghz-publish's
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.90.0
          targets: x86_64-unknown-linux-musl,armv7-unknown-linux-musleabihf
      - name: musl C compiler (moq-subghz-publish builds C for its TLS)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: scripts/release.sh
        run: scripts/release.sh ci

  firmware:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@547f64eaa184fd62768e02b77019e5408713ca53 # pinned action commit; the toolchain is the `toolchain` input
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - name: shipped UF2 matches SHA256SUMS
        working-directory: firmware
        run: sha256sum -c SHA256SUMS
      - name: fmt, clippy, build
        working-directory: firmware/rp2040-sx1276-fw
        run: |
          cargo fmt --all --check
          cargo clippy --release --locked --target thumbv6m-none-eabi -- -D warnings
          cargo build --release --locked --target thumbv6m-none-eabi
