[package]
name = "moq-subghz-radio-sx1276"
version = "0.0.1"
description = "SX1276 backends for moq-subghz-link: FSK and LoRa on the Pi HAT, the CatWAN stick, and the R-line loopback file"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
moq-subghz-link = { path = "../../moq-subghz-link" }
moq-subghz-wire = { path = "../../moq-subghz-wire" }
moq-subghz-licence = { path = "../../moq-subghz-licence" }
anyhow = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
moq-subghz-pi = { path = "../../moq-subghz-pi" }
sx1276 = { path = "../../vendor/sx1276" }
