[package]
name = "moq-subghz-wire"
version = "0.1.0"
description = "MoQ-style object/group framing, XOR-parity FEC and H.264 access-unit splitting for <=255 B radio frames"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["seal"]
# Object sealing (`seal`): the AEAD and the key file reader. Framing, FEC and the Annex-B splitter
# build without it.
seal = ["dep:rind", "dep:libc"]

[dependencies]
# kixel-ai/rind main, pinned (pure-Rust AEAD; armv7 uses its portable/arm backend).
# rind has no crates.io release, so this is a git dependency pinned to one commit: the rev is the
# moq-subghz decision, and the same commit is locked in Cargo.lock. Moving it is a reviewed change
# (see docs/DEPENDENCIES.md), never a `cargo update`.
rind = { git = "https://github.com/kixel-ai/rind", rev = "d2dc35bd796aaadc42df56aee0f1526cdee94b66", optional = true }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK for opening the key file, and mkfifo in its test
libc = { version = "0.2", optional = true }

[[test]]
name = "golden_v5"
# the sealed half of the golden hashes needs the sealer
required-features = ["seal"]
